<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Backwards Planner</title>
    <meta name="theme-color" content="#1f2937" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="tabs" role="tablist" aria-label="Sections">
        <button
          id="tab-planning"
          class="tab"
          type="button"
          role="tab"
          aria-controls="panel-planning"
          aria-selected="true"
        >
          Planning
        </button>
        <button
          id="tab-templates"
          class="tab"
          type="button"
          role="tab"
          aria-controls="panel-templates"
          aria-selected="false"
          tabindex="-1"
        >
          Templates
        </button>
      </div>

      <section
        id="panel-planning"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-planning"
        tabindex="0"
      >
        <header class="deadline">
          <button id="deadline-open" class="deadline__when" type="button" aria-haspopup="dialog">
            <span id="deadline-time" class="deadline__time"></span>
          </button>
          <input
            id="deadline-label"
            class="deadline__label"
            type="text"
            placeholder="Flight departs"
            autocomplete="off"
            aria-label="Deadline name"
          />
          <span id="deadline-date" class="deadline__date" aria-hidden="true"></span>
        </header>

        <p id="hint" class="hint" hidden></p>

        <ol id="steps" class="steps"></ol>

        <footer id="leave" class="leave" hidden>
          <span class="leave__caption">Leave by</span>
          <strong id="leave-time" class="leave__time"></strong>
          <span id="leave-date" class="leave__date"></span>
          <span id="leave-total" class="leave__total"></span>
        </footer>

        <form id="add-step" class="add-step">
          <input
            id="new-label"
            class="add-step__label"
            type="text"
            placeholder="Step before that…"
            autocomplete="off"
            aria-label="Step name"
            required
          />
          <input
            id="new-minutes"
            class="add-step__minutes"
            type="number"
            step="1"
            placeholder="min"
            aria-label="Minutes"
          />
          <button class="add-step__submit" type="submit">Add</button>
        </form>

        <p class="actions">
          <button id="insert" class="clear-all" type="button" hidden>Insert</button>
          <button id="reorder" class="clear-all" type="button" hidden>Reorder</button>
          <button id="clear-all" class="clear-all" type="button" hidden>Clear plan</button>
        </p>
      </section>

      <section
        id="panel-templates"
        class="panel"
        role="tabpanel"
        aria-labelledby="tab-templates"
        tabindex="0"
        hidden
      >
        <p id="templates-empty" class="templates-empty" hidden></p>
        <p class="templates-save-row">
          <button id="template-save" class="templates-save" type="button" hidden>
            Save current plan as template
          </button>
        </p>
        <ul id="template-list" class="template-list"></ul>
        <p class="transfer">
          <button id="export-all" class="transfer__action" type="button">Export all</button>
          <button id="import-open" class="transfer__action" type="button">Import…</button>
        </p>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
        <div id="sync" class="sync">
          <span id="sync-text" class="sync__text" role="status"></span>
          <button id="sync-action" class="sync__action" type="button" hidden></button>
          <details id="sync-more" class="template__more sync__more" hidden>
            <summary class="template__action template__more-toggle" aria-label="Sync options">⋯</summary>
            <div class="template__menu">
              <button class="template__menu-item" type="button" data-sync="now">Sync now</button>
              <button class="template__menu-item" type="button" data-sync="off">Turn off</button>
            </div>
          </details>
        </div>
      </section>

      <p class="whats-new">
        <a id="whats-new" class="whats-new__link" href="./release-notes/">
          What&rsquo;s new<span id="whats-new-dot" class="whats-new__dot" hidden></span>
        </a>
      </p>
    </main>

    <div id="undo" class="undo" role="status" aria-live="polite" hidden>
      <span id="undo-message" class="undo__message"></span>
      <button id="undo-action" class="undo__action" type="button">Undo</button>
    </div>

    <dialog id="import-dialog" class="import" aria-labelledby="import-title">
      <form id="import-form" class="import__form" method="dialog">
        <h2 id="import-title" class="import__title"></h2>
        <div id="import-body" class="import__body"></div>
        <label id="import-all-row" class="import__all" hidden>
          <input id="import-all" type="checkbox" />
          <span id="import-all-label"></span>
        </label>
        <div id="import-buttons" class="import__buttons"></div>
      </form>
    </dialog>

    <dialog id="deadline-picker" class="picker" aria-label="Deadline date and time">
      <div class="picker__body">
        <div class="picker__chips" role="group" aria-label="Day">
          <button class="picker__chip" type="button" data-day="today">Today</button>
          <button class="picker__chip" type="button" data-day="tomorrow">Tomorrow</button>
          <button class="picker__chip" type="button" data-day="other">Other…</button>
        </div>
        <p class="picker__dateline" aria-live="polite"></p>

        <div class="picker__clock">
          <div class="picker__time">
            <button class="picker__part" type="button" data-part="hours" aria-label="Hours"></button>
            <span class="picker__colon" aria-hidden="true">:</span>
            <button class="picker__part" type="button" data-part="minutes" aria-label="Minutes"></button>
          </div>
          <div class="picker__quick">
            <button type="button" data-minutes="0">:00</button>
            <button type="button" data-minutes="15">:15</button>
            <button type="button" data-minutes="30">:30</button>
            <button type="button" data-minutes="45">:45</button>
          </div>
          <div class="picker__keys">
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-key="erase" aria-label="Erase">⌫</button>
            <button type="button" data-key="0">0</button>
            <button class="picker__set" type="button">Set</button>
          </div>
        </div>

        <div class="picker__calendar" hidden>
          <div class="picker__month">
            <button type="button" data-month="-1" aria-label="Previous month">‹</button>
            <span class="picker__month-name"></span>
            <button type="button" data-month="1" aria-label="Next month">›</button>
          </div>
          <div class="picker__days"></div>
        </div>

        <p class="picker__hint">
          Type <kbd>1</kbd><kbd>4</kbd><kbd>3</kbd><kbd>5</kbd>. <kbd>T</kbd> today,
          <kbd>M</kbd> tomorrow, <kbd>O</kbd> other. <kbd>Enter</kbd> sets, <kbd>Esc</kbd> closes.
        </p>
        <button class="picker__set picker__set--desk" type="button">Set</button>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
