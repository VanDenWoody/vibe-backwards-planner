<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Backwards Planner</title>
    <meta name="theme-color" content="#1f2937" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="deadline">
        <span class="deadline__when">
          <span id="deadline-time" class="deadline__time" aria-hidden="true"></span>
          <input
            id="deadline-input"
            class="deadline__input"
            type="datetime-local"
            aria-label="Deadline date and time"
          />
        </span>
        <input
          id="deadline-label"
          class="deadline__label"
          type="text"
          placeholder="Flight departs"
          autocomplete="off"
          aria-label="Deadline name"
        />
        <span id="deadline-date" class="deadline__date" aria-hidden="true"></span>
      </header>

      <section id="templates" class="templates" aria-label="Templates">
        <div class="templates__row">
          <select id="template-picker" class="templates__picker" aria-label="Load a template">
            <option value="">Load a template…</option>
          </select>
          <button id="template-update" class="templates__action" type="button" hidden></button>
          <button id="template-save" class="templates__action" type="button">Save…</button>
          <button id="template-delete" class="templates__delete" type="button" hidden>×</button>
        </div>
        <form id="template-name-form" class="templates__naming" hidden>
          <input
            id="template-name"
            class="templates__name"
            type="text"
            placeholder="Name this template"
            autocomplete="off"
            aria-label="Template name"
          />
          <button class="templates__submit" type="submit">Save</button>
          <button id="template-cancel" class="templates__action" type="button">Cancel</button>
        </form>
      </section>

      <p id="hint" class="hint" hidden></p>

      <ol id="steps" class="steps"></ol>

      <footer id="leave" class="leave" hidden>
        <span class="leave__label">
          <span class="leave__caption">Leave</span>
          <span id="leave-total" class="leave__total"></span>
        </span>
        <strong id="leave-time" class="leave__time"></strong>
      </footer>

      <form id="add-step" class="add-step">
        <input
          id="new-label"
          class="add-step__label"
          type="text"
          placeholder="Step before that…"
          autocomplete="off"
          aria-label="Step name"
          required
        />
        <input
          id="new-minutes"
          class="add-step__minutes"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          placeholder="min"
          aria-label="Minutes"
        />
        <button class="add-step__submit" type="submit">Add</button>
      </form>

      <p class="actions">
        <button id="clear-all" class="clear-all" type="button" hidden>Clear all steps</button>
      </p>
    </main>

    <div id="undo" class="undo" role="status" aria-live="polite" hidden>
      <span id="undo-message" class="undo__message"></span>
      <button id="undo-action" class="undo__action" type="button">Undo</button>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
